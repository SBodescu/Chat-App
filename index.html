<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y! Messenger Fullscreen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <header class="app-header">
            <div class="brand">
                <span class="y-logo">Y!</span> Messenger
            </div>
            <div class="header-status">
                Signed in as: <strong>Eu</strong> (Invisible)
            </div>
        </header>

        <div class="main-body">
            <aside class="sidebar">
                <div class="my-profile-area">
                    <div class="status-box">
                        <div class="avatar-box">
                            <div class="pixel-avatar">EU</div> 
                        </div>
                        <div class="my-info">
                            <span class="my-name">Eu</span>
                            <span class="status-text">Nu deranjați...</span>
                        </div>
                    </div>
                </div>

                <div class="ym-tabs">
                    <div class="tab active">Contacts</div>
                </div>

                <div class="contacts-list">
                    <div class="group-header" >
                        <span id="friends-count">▼ Friends</span>
                        <button id="add-friend-btn" title="Add New Friend">+ Add</button>
                    </div>
                    
                    <div id="friends-list-container"></div>
                </div>
            </aside>

            <main class="chat-area">
                
                <div class="chat-top-bar">
                    <div class="chat-partner-info">
                        To: <strong id="current-chat-name">Select a friend</strong> 
                        <span id="current-chat-status" class="status-brackets"></span>
                    </div>
                </div>

                <div id="messages-display" class="messages-display"></div>

                <footer class="chat-input-area">
                    <div class="format-toolbar">
                        <button class="fmt-btn font-btn">Verdana (10)</button>
                        <button class="fmt-btn"><b>B</b></button>
                        <button class="fmt-btn"><i>I</i></button>
                        <button class="fmt-btn" style="text-decoration: underline;">U</button>
                        <div class="separator"></div>
                        <button class="fmt-btn" style="color:red">Color</button>
                        <button class="fmt-btn">☺</button>

                        <div class="separator"></div>
                        <div class="sender-switcher">
                            <span class="switcher-label">Send as:</span>
                            
                            <label class="radio-option">
                                <input type="radio" name="sender-switch" value="me" checked> 
                                <span id="label-me" class="sender-name me">Eu</span>
                            </label>

                            <label class="radio-option">
                                <input type="radio" name="sender-switch" value="them"> 
                                <span id="label-them" class="sender-name them">Friend</span>
                            </label>
                        </div>
                        <button id="buzz-btn" class="buzz-btn" title="Send a BUZZ!">BUZZ!!</button>
                    </div>
                    <div class="input-wrapper">
                        <textarea id="message-input" placeholder=""></textarea>
                        <div class="send-container">
                            <button id="send-btn" class="btn-send">Send</button>
                        </div>
                    </div>
                </footer>

            </main>
        </div>
        
        <footer class="app-footer">
            <span>Yahoo! Inc. © 2005 </span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
